server.port=8080
spring.application.name=dsa-summariser

# Gemini. The key comes from the GEMINI_API_KEY environment variable, or from gemini.api.key in
# application-local.properties (git-ignored; activate with the "local" profile, which overrides this line).
# Never put a real key in this file.
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-3.8-flash
# On HTTP 503 or a connect/read timeout: wait retry-delay-millis and retry once with the main model; if that
# also fails and the fallback is enabled, make one call with the fallback model. Never retried: 400/401/403,
# 429, blocked or malformed output.
gemini.fallback-enabled=true
gemini.fallback-model=gemini-3.5-flash-lite
gemini.retry-delay-millis=2000
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout.connect-seconds=5
gemini.timeout.read-seconds=60

# Measurement switch: false sends the whole transcript to Gemini (no filtering), so filtered and
# unfiltered input tokens can be compared in the logs.
summariser.filter-enabled=true
